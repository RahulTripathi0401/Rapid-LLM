# Model: Llama-3.1-8B (dense) decoded with block diffusion
# Source: https://huggingface.co/meta-llama/Llama-3.1-8B
# Project: 3 (block diffusion). Same model as Llama3.1-8B_inf.yaml, set to the required
#   evaluation's first case: batch 1, prompt 512, output 128, b = 8, R = 4.
#   Delete the project_param block (or set decode_schedule: autoregressive) for normal decode.

model_param:
  mode: "LLM"                         # LLM, or GEMM for a single matrix multiply
  run_type: "inference"               # inference or training
  model_type: "llama"                 # gpt (GELU MLP), llama (SwiGLU), deepseek_v3 or glm4_moe
  tied_embeddings: false              # input embedding shared with the output head (memory only)
  global_batch_size: 1                # sequences served together (B)
  gradient_accumulation_steps: 1      # training only; leave at 1
  seq_len: 640                        # prefill + decode tokens (512 + 128)
  decode_len: 128                     # decode tokens (output length O)
  hidden_dim: 4096                    # hidden size (H)
  num_layers: 32                      # transformer layers
  vocab_size: 128256                  # vocabulary size
  intermediate_size: 14336            # dense feed-forward width
  attention:
    attention_type: "gqa"             # mha, gqa or mla
    num_heads: 32                     # query heads
    kv_heads: 8                       # key/value heads
    use_flashattention: true          # price attention as FlashAttention
    attention_tile_size: 128          # FlashAttention tile size
  moe:
    num_experts: 1                    # experts per MoE layer (1 = dense model)
    top_k: 1                          # experts used per token
    moe_intermediate_size: 14336      # feed-forward width of one expert
    n_shared_experts: 0               # always-on shared experts
    moe_layer_freq: 1                 # every Nth layer is an MoE layer
    first_k_dense_replace: 32         # the first k layers are dense

project_param:
  decode_schedule: block_diffusion    # autoregressive (default) or block_diffusion
  block_size: 8                       # b: tokens per block; must divide decode_len
  refine_rounds: 4                    # R: model calls that refine each block
  kv_save_pass: false                 # true: one more call per block stores the block's K/V (R + 1)
  decode_head_all_rows: false         # true: price the decode output head for all B*b rows (sensitivity)
